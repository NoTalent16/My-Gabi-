<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love you &lt;3</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:Arial,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #start{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;z-index:5;color:white;border:0;font-size:22px;font-weight:700;
    letter-spacing:.5px;cursor:pointer
  }
  #start span{padding:18px 28px;border:1px solid rgba(255,255,255,.25);border-radius:999px;
    background:rgba(255,255,255,.06);backdrop-filter:blur(8px)}
  #hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;color:rgba(255,255,255,.45);
    font-size:12px;pointer-events:none;z-index:2}
</style>
</head>
<body>
<button id="start"><span>❤️ Tap to open ❤️</span></button>
<canvas id="canvas"></canvas>
<div id="hint">Turn up your volume</div>
<audio id="music" src="love_you.mp3" preload="auto" loop></audio>

<script>
const canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
const start=document.getElementById("start"), music=document.getElementById("music");
let W,H,DPR,particles=[],frame=0,started=false;
const WORDS=["love you","Love You","LOVE YOU"];
const COLORS=["rgb(70,130,180)","rgb(30,144,255)","rgb(0,191,255)","rgb(100,149,237)","rgb(65,105,225)"];

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize); resize();

function heart(t){
  const x=16*Math.sin(t)**3;
  const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  return [x,y];
}
function screen(x,y){
  const scale=Math.min(W,H)/46;
  return [x*scale+W/2,y*scale+H/2];
}
function addParticle(x,y,delay,size,kind){
  particles.push({
    x,y,delay,size,kind,alpha:0,
    word:WORDS[Math.floor(Math.random()*WORDS.length)],
    color:COLORS[Math.floor(Math.random()*COLORS.length)],
    phase:Math.random()*Math.PI*2
  });
}

function build(){
  particles=[];
  const outlineN=160, fillN=130, minGap=Math.min(W,H)*.014;
  const placed=[];
  for(let i=0;i<outlineN;i++){
    const t=i/outlineN*Math.PI*2, [bx,by]=heart(t), [x,y]=screen(bx,by);
    if(placed.some(p=>Math.hypot(x-p[0],y-p[1])<minGap)) continue;
    placed.push([x,y]);
    addParticle(x,y,i*1.6,0.85+Math.random()*.3,"outline");
  }
  const outlineSpan=outlineN*1.6;
  let tries=0;
  while(particles.filter(p=>p.kind==="fill").length<fillN && tries<fillN*100){
    tries++;
    const t=Math.random()*Math.PI*2, r=Math.random()*.86;
    const [bx,by]=heart(t), [x,y]=screen(bx*r,by*r);
    if(placed.some(p=>Math.hypot(x-p[0],y-p[1])<minGap*1.5)) continue;
    placed.push([x,y]);
    addParticle(x,y,Math.floor(outlineSpan+30+Math.random()*320),.85+Math.random()*.3,"fill");
  }
}
build();

function drawText(p){
  if(p.alpha<=0)return;
  const base=p.kind==="outline"?20:17;
  const size=base*p.size*(Math.min(W,H)/1200);
  ctx.save();
  ctx.font=`700 ${Math.max(9,size)}px Arial`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  const flick=p.alpha>=255 ? .75+.25*Math.sin(frame*.04+p.phase):1;
  const a=p.alpha*flick/255;
  ctx.shadowBlur=16;
  ctx.shadowColor=p.color;
  ctx.globalAlpha=a*.22;
  ctx.fillStyle=p.color; ctx.fillText(p.word,p.x,p.y);
  ctx.shadowBlur=7;ctx.globalAlpha=a*.65;
  ctx.fillText(p.word,p.x,p.y);
  ctx.shadowBlur=0;ctx.globalAlpha=a;
  ctx.fillText(p.word,p.x,p.y);
  ctx.restore();
}

function loop(){
  if(!started)return;
  frame++;
  ctx.clearRect(0,0,W,H);
  for(const p of particles){
    if(frame>p.delay && p.alpha<255)p.alpha=Math.min(255,p.alpha+14+Math.random()*4);
    drawText(p);
  }
  const centerStart=outlineNFrames()+230;
  if(frame>centerStart){
    const progress=Math.min(1,(frame-centerStart)/60);
    const alpha=255*(1-Math.exp(-progress*8));
    const pulse=1+.025*Math.sin(frame*.05);
    ctx.save();
    ctx.translate(W/2,H/2);ctx.scale(pulse,pulse);
    ctx.font=`700 ${Math.max(30,54*Math.min(W,H)/1200)}px Georgia`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.shadowBlur=28;ctx.shadowColor="rgba(255,255,255,.55)";
    ctx.globalAlpha=alpha/255;
    ctx.fillStyle="rgb(255,250,245)";
    ctx.fillText("Love You",0,0);
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
function outlineNFrames(){return 160*1.6+30+200;}
start.addEventListener("click",async()=>{
  started=true; start.style.display="none";
  try{ await music.play(); }catch(e){}
  loop();
});
</script>
</body>
</html>
